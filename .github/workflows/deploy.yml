name: Aegis CI/CD

on:
  push:
    branches: [ main, project-aegis ]
  pull_request:
    branches: [ main, project-aegis ]

jobs:
  validate:
    name: Terraform Validate & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -backend=false # No backend needed for validation

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

  python-lint:
    name: Python Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install requests flake8

      - name: Lint with flake8
        run: flake8 monitor.py --count --select=E9,F63,F7,F82 --show-source --statistics