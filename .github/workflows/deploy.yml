name: Aegis CI/CD
on:
  push:
    branches: [ main, project-aegis ]
  pull_request:
    branches: [ main, project-aegis ]

jobs:
  validate:
    name: Terraform Validate & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        run: terraform init -backend=false
      - name: Terraform Format Check
        run: terraform fmt -check
      - name: Terraform Validate
        run: terraform validate

  python-lint:
    name: Python Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Dependencies
        run: pip install requests flake8
      - name: Lint with flake8
        run: flake8 monitor.py --count --select=E9,F63,F7,F82 --show-source --statistics

  deploy-and-monitor:
    name: Deploy & Health Check
    needs: [validate, python-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Start Docker (Local Runner)
        run: |
          # Ensuring the runner can handle the Docker provider
          terraform init
          terraform apply -auto-approve

      - name: Run Health Check
        id: health_check
        run: |
          # Port 9000 maps to internal 80 as per main.tf
          # We use localhost since the container is running on the runner
          echo "Waiting for container to stabilize..."
          sleep 5
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:9000 || echo "000")
          echo "Health check returned $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "health_status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi
        continue-on-error: true

      - name: Automated Rebuild (Self-Healing)
        if: steps.health_check.outputs.health_status == 'failed'
        run: |
          echo "Container unhealthy! Triggering automated rebuild..."
          terraform apply -replace="docker_container.aegis_link_test" -auto-approve
