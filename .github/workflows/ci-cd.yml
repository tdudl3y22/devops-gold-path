name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/tdudl3y22/devops-gold-path/app:latest

      # Example: Deploy to Render via Deploy Hook
      # You would add your Render Deploy Hook URL to your GitHub Secrets
      - name: Deploy to Production
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
